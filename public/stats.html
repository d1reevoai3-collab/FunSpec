<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FunSpec - Статистика онлайна</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23a71d31%22/><path d=%22M30 45v-10a20 20 0 0 1 40 0v10m-30 0h20a5 5 0 0 1 5 5v20a5 5 0 0 1-5 5H30a5 5 0 0 1-5-5V50a5 5 0 0 1 5-5z%22 fill=%22none%22 stroke=%22white%22 stroke-width=%228%22 stroke-linejoin=%22round%22/></svg>">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    .stats-wrapper {
      min-height: 100vh;
      background: radial-gradient(circle at center, rgba(167, 29, 49, 0.12) 0%, var(--bg-base) 80%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px;
    }
    
    .stats-container {
      width: 100%;
      max-width: 900px;
      position: relative;
    }
    
    .stats-header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .greeting-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 8px;
      color: var(--text-primary);
    }
    
    .greeting-subtitle {
      font-size: 15px;
      color: var(--text-secondary);
    }
    
    /* Chart Card */
    .chart-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 40px;
      transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
      position: relative;
      overflow: hidden;
    }
    
    .chart-card:hover {
      border-color: rgba(167, 29, 49, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(167, 29, 49, 0.15);
    }

    .chart-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      transition: opacity var(--transition-normal);
    }
    
    .chart-card:hover::before {
      opacity: 1;
    }

    .chart-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 24px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .chart-wrapper {
      position: relative;
      height: 350px;
      width: 100%;
    }
    
    /* Navigation Link */
    .nav-container {
      text-align: center;
    }
    
    .link-download-trigger {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 12px;
      border: 1px solid rgba(167, 29, 49, 0.4);
      background-color: var(--accent);
      box-shadow: 0 4px 15px rgba(167, 29, 49, 0.3);
      transition: all var(--transition-normal);
    }

    .link-download-trigger:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(167, 29, 49, 0.5);
    }

    .link-download-trigger svg {
      width: 18px;
      height: 18px;
      transition: transform var(--transition-fast);
    }

    .link-download-trigger:hover svg {
      transform: translateX(4px);
    }
    
    /* Loader Spinner styles */
    .loader-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 400px;
      gap: 16px;
    }
    
    .loader-text {
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
    }
    
    /* Error container */
    .error-state {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 48px;
      text-align: center;
      color: var(--text-secondary);
      width: 100%;
    }
    
    .error-state svg {
      width: 48px;
      height: 48px;
      color: var(--danger);
      margin-bottom: 16px;
    }
    
    .error-state h3 {
      font-size: 18px;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    /* Screen transition */
    .view-screen {
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    
    .view-screen.active {
      opacity: 1;
      transform: translateY(0);
    }
    
  </style>
</head>
<body>

  <div class="stats-wrapper">
    <div class="stats-container">
      
      <!-- SPINNER LOADER CONTAINER -->
      <div id="stats-loader" class="loader-container">
        <div class="spinner"></div>
        <div class="loader-text">Загрузка статистики...</div>
      </div>
      
      <!-- MAIN STATS VIEW (Hidden by default) -->
      <div id="stats-content" class="view-screen" style="display: none;">
        <!-- HEADER -->
        <div class="stats-header">
          <h1 class="greeting-title" id="greeting-title">Добро пожаловать</h1>
          <p class="greeting-subtitle">Статистика онлайна игроков</p>
        </div>
        
        <!-- CHART CARD -->
        <div class="chart-card">
          <h2 class="chart-title">Топ 5 игроков по времени</h2>
          <div class="chart-wrapper">
            <canvas id="topPlaytimeChart"></canvas>
          </div>
        </div>
        
        <!-- NAVIGATION -->
        <div class="nav-container">
          <a href="/download" class="link-download-trigger">
            <span>Перейти к загрузкам</span>
            <!-- Arrow Right Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </a>
        </div>
      </div>
      
      <!-- ERROR/EMPTY STATE CONTAINER -->
      <div id="stats-error" class="error-state" style="display: none;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <h3 id="error-title">Не удалось получить данные</h3>
        <p id="error-message">Пожалуйста, попробуйте обновить страницу позже.</p>
      </div>

    </div>
  </div>

  <script>
    function formatPlaytime(seconds) {
      if (seconds < 60) return `${seconds} сек`;
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      if (hrs > 0) {
        return `${hrs} ч ${mins} мин`;
      }
      return `${mins} мин`;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const loader = document.getElementById('stats-loader');
      const content = document.getElementById('stats-content');
      const errorState = document.getElementById('stats-error');
      const greetingTitle = document.getElementById('greeting-title');

      try {
        // 1. Fetch Auth Status
        const authRes = await fetch('/api/auth/status');
        const authData = await authRes.json();
        
        if (authData.authenticated && authData.name) {
          greetingTitle.textContent = `Добро пожаловать, ${authData.name}`;
        } else {
          greetingTitle.textContent = `Добро пожаловать, Сотрудник`;
        }

        // 2. Fetch Analytics
        const analyticsRes = await fetch('/api/analytics');
        if (!analyticsRes.ok) throw new Error('Сбой при загрузке аналитики');
        const analyticsData = await analyticsRes.json();

        if (!analyticsData.success || !analyticsData.analytics || !analyticsData.analytics.topPlaytime) {
          throw new Error('Нет данных для отображения');
        }

        const topPlaytime = analyticsData.analytics.topPlaytime;
        
        // Prepare data for chart
        const labels = topPlaytime.map(item => `id${item.vkId}`);
        const dataSeconds = topPlaytime.map(item => item.playtimeSeconds);
        const dataFormatted = topPlaytime.map(item => formatPlaytime(item.playtimeSeconds));

        // 3. Render Chart
        const ctx = document.getElementById('topPlaytimeChart').getContext('2d');
        
        // Custom tooltips to show formatted playtime
        const tooltipOptions = {
          backgroundColor: 'rgba(18, 19, 22, 0.95)',
          titleFont: { size: 14, family: "'Outfit', sans-serif" },
          bodyFont: { size: 14, family: "'Outfit', sans-serif" },
          padding: 12,
          cornerRadius: 8,
          borderColor: 'rgba(167, 29, 49, 0.3)',
          borderWidth: 1,
          displayColors: false,
          callbacks: {
            label: function(context) {
              const idx = context.dataIndex;
              return `Время в игре: ${dataFormatted[idx]}`;
            }
          }
        };

        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: 'Сек.',
              data: dataSeconds,
              backgroundColor: 'rgba(167, 29, 49, 0.7)',
              hoverBackgroundColor: 'rgba(200, 35, 60, 0.9)',
              borderRadius: 8, // Rounded top corners
              borderSkipped: false
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: tooltipOptions
            },
            scales: {
              x: {
                grid: { display: false, drawBorder: false },
                ticks: {
                  color: '#9ca3af',
                  font: { family: "'Outfit', sans-serif", size: 13 }
                }
              },
              y: {
                grid: { color: 'rgba(255, 255, 255, 0.05)', drawBorder: false },
                ticks: {
                  display: false // Hide raw seconds on Y axis
                }
              }
            },
            interaction: {
              mode: 'index',
              intersect: false,
            }
          }
        });

        // 4. Show Content smoothly
        loader.style.display = 'none';
        content.style.display = 'block';
        content.offsetHeight; // trigger reflow
        content.classList.add('active');

      } catch (err) {
        console.error(err);
        loader.style.display = 'none';
        document.getElementById('error-title').textContent = 'Ошибка загрузки статистики';
        document.getElementById('error-message').textContent = err.message || 'Пожалуйста, обратитесь в службу поддержки.';
        errorState.style.display = 'block';
      }
    });
  </script>
</body>
</html>
